<div th:fragment="memory" class="col-xl-3 col-md-6 mb-4">
<div class="card border-left-info shadow h-100 py-2">
<div class="card-body">
<div class="row no-gutters align-items-center">

	<div class="text-xs font-weight-bold text-info text-uppercase mb-1">
		<span th:text="#{dashboard.memory}"></span>
	</div>

	<div class="row no-gutters align-items-center">
		<div class="h5 mb-0 mr-3 font-weight-bold text-gray-800">
			<span th:text="|${memoryPercent}%|"></span>
			<span class="ml-2 text-muted small" th:text="|${memoryMB}MB|"></span>
		</div>
	</div>

	<div>
		<div class="progress progress-sm w-100">
			<div class="progress-bar bg-info" role="progressbar"
			     th:style="|width: ${memoryPercent}%|"
			     th:aria-valuenow="${memoryPercent}"
				 aria-valuemin="0"
				 aria-valuemax="100"></div>
		</div>
	</div>

</div>
</div>
</div>
</div>
