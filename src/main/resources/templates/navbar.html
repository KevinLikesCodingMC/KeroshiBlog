<div th:fragment="navbar-blog">
	<nav class="navbar navbar-expand-sm keroshi-blue-navbar">
		<div class="container-fluid">
			<a class="navbar-brand" th:href="@{/}">
				Keroshi Blog
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#top-bar" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="top-bar">
				<ul class="navbar-nav me-auto mb-2 mb-sm-0">
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
							<span th:text="#{setting.language}"></span>
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="?lang=en">English</a></li>
							<li><a class="dropdown-item" href="?lang=zh_cn">简体中文</a></li>
						</ul>
					</li>
				</ul>

				<ul class="navbar-nav" th:if="${currentUser == null}">
					<li class="nav-item">
						<a class="nav-link" th:href="@{/register}">
							<span th:text="#{user.register}"></span>
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/login}">
							<span th:text="#{user.login}"></span>
						</a>
					</li>
				</ul>

				<ul class="navbar-nav" th:if="${currentUser != null}">
					<li class="nav-item">
						<a class="nav-link">
							<span th:text="${currentUser.username}"></span>
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#" id="logout">
							<span th:text="#{user.logout}"></span>
						</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
</div>
